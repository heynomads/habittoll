<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>HabitToll</title>
<meta name="description" content="HabitToll puts a price on the apps you want to open less.">
<link rel="icon" href="data:,">
<style>
:root{--paper:#F1ECE2;--ink:#161513;--muted:#5E5A53;--rule:#D8CFBF;--red:#D6422B}
@media (prefers-color-scheme:dark){:root{--paper:#161513;--ink:#EDE7DC;--muted:#A39D93;--rule:#36322C;--red:#E5573F}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);
  font:17px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  overflow-wrap:break-word}
.wrap{max-width:40rem;margin:0 auto;padding:0 20px}
.top{padding-top:28px}
.mark{font-family:ui-serif,"New York",Georgia,"Times New Roman",serif;font-size:21px;color:var(--ink);text-decoration:none}
.dot{color:var(--red)}
h1,h2,h3{font-family:ui-serif,"New York",Georgia,"Times New Roman",serif;font-weight:400;letter-spacing:-.01em}
h1{font-size:2.3rem;line-height:1.15;margin:44px 0 6px}
h2{font-size:1.4rem;line-height:1.3;margin:40px 0 10px;padding-top:26px;border-top:1px solid var(--rule)}
h1+p em{color:var(--muted);font-style:normal;font-size:15px}
p{margin:0 0 14px}
ul{margin:0 0 14px;padding-left:1.25em}
li{margin:5px 0}
li>ul{margin:6px 0 0}
strong{font-weight:600}
a{color:inherit;text-decoration-color:var(--muted);text-decoration-thickness:1px;text-underline-offset:3px}
footer{margin-top:64px;padding:22px 0 44px;border-top:1px solid var(--rule);font-size:15px;color:var(--muted)}
footer a{color:var(--muted)}
footer p{margin:0 0 6px}
.home h1{font-size:3.2rem;margin-top:72px}
.lede{font-family:ui-serif,"New York",Georgia,"Times New Roman",serif;font-size:1.5rem;line-height:1.3;margin:0 0 22px}
.links{list-style:none;padding:0;margin:30px 0}
.links li{border-top:1px solid var(--rule);margin:0}
.links li:last-child{border-bottom:1px solid var(--rule)}
.links a{display:block;padding:14px 0;text-decoration:none;font-size:18px}
.links a::after{content:"\2192";float:right;color:var(--muted)}
</style>
</head>
<body>
<main class="wrap home">
<h1>HabitToll<span class="dot">.</span></h1>
<p class="lede">Put a price on your scroll.</p>
<p>An iPhone app by Comads OÜ. Blocking is free. Unlocks cost what you set.</p>
<ul class="links">
<li><a href="privacy/">Privacy Policy</a></li>
<li><a href="terms/">Terms of Use</a></li>
<li><a href="imprint/">Imprint</a></li>
</ul>
<p>Questions or problems? Write to <a href="mailto:help@elynd.app">help@elynd.app</a>.</p>
</main>
<footer class="wrap">
<p>Comads OÜ · Tallinn, Estonia</p>
</footer>
</body>
</html>
